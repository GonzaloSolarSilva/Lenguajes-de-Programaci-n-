spring.application.name=sabor-criollo-pedidos
server.port=8080

# --- Base de datos en la nube (PostgreSQL / Supabase) ---
# Las credenciales se leen de variables de entorno: nunca se escriben en el repositorio.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
# validate: Hibernate comprueba que las entidades coincidan con las tablas creadas por sql/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Datos de demostración (mesas, carta, insumos y usuarios) ---
# Se cargan solo si la tabla usuario está vacía. Cambiar a false para desactivarlos.
app.seed.enabled=true
